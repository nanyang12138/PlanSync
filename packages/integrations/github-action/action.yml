name: 'PlanSync Drift Check'
description: 'Check if PR tasks are aligned with the active plan'
inputs:
  api-url:
    description: 'PlanSync API URL'
    required: true
  api-key:
    description: 'PlanSync API Key'
    required: true
  project:
    description: 'Project ID'
    required: true
  task-ids:
    description: 'Comma-separated PlanSync task IDs to scope the drift check to. When provided, only drifts affecting these tasks gate the PR.'
    required: false
    default: ''
  branch-name:
    description: 'PR branch name. When provided (and `task-ids` is empty), the action looks up tasks whose `branchName` matches and scopes the drift check to them.'
    required: false
    default: ''
  pr-files:
    description: 'List of files changed by the PR. Accepts newline- or comma-separated input (e.g. `gh pr diff --name-only`); when no newline/comma is present the input is split on whitespace as a fallback for the default `tj-actions/changed-files` space-separated `all_changed_files` output. Filenames containing spaces are preserved only when the input also uses a newline or comma delimiter. When provided, the action also runs the R-157 semantic gate: every PR file must match at least one `file_glob` deliverable on the active plan. If empty, the semantic gate is skipped (the legacy drift-only gate still runs).'
    required: false
    default: ''
  legacy-mode:
    description: 'When `true`, disables the R-157 semantic deliverable gate and only runs the legacy open-drift-count check. Use this only as an emergency rollback.'
    required: false
    default: 'false'
  strict-sourcing:
    description: 'R-207 / L3. When `true`, every PR must map to a task bound to the CURRENT active plan version: project-wide (unscoped) runs are refused, a scope that matches zero tasks fails, and any scoped task on a stale plan version fails (rebind required). Default `false` keeps existing workflows wire-compatible. Pair with `branch-name` (or `task-ids`) for scoping, and configure the action as a required status check to make this unbypassable at merge.'
    required: false
    default: 'false'
  exempt-labels:
    description: 'R-207 / L3. Comma-separated PR labels that exempt a PR from the gate (e.g. `plansync:exempt` for dependabot / CI-config / the workflow file itself). Requires the `github-token`, `repo`, and `pr-number` trio to read labels; if those are absent the gate runs (fail-closed). Applying a label needs repo write access, so the exemption is auditable and not self-grantable in the workflow file.'
    required: false
    default: ''
  github-token:
    description: 'GitHub token (typically `${{ secrets.GITHUB_TOKEN }}`) used to PATCH the PR body with the R-193 `<!-- plansync-status -->` block. Optional — all three of `github-token`, `repo`, and `pr-number` must be set together to enable the body sync.'
    required: false
    default: ''
  repo:
    description: 'Repository in `owner/name` form (typically `${{ github.repository }}`). Required for R-193 PR-body sync.'
    required: false
    default: ''
  pr-number:
    description: 'Pull request number (typically `${{ github.event.pull_request.number }}`). Required for R-193 PR-body sync.'
    required: false
    default: ''
outputs:
  drift-count:
    description: 'Number of open drift alerts'
  has-drift:
    description: 'Whether any open drifts were found'
  semantic-gate:
    description: 'Outcome of the R-157 semantic gate: `skipped` (no globs / legacy mode / no files), `passed`, or `failed`.'
  unmatched-files:
    description: 'Newline-separated list of PR files that did not match any active deliverable glob (only populated when `semantic-gate=failed`).'
  pr-body-updated:
    description: 'R-193: `"true"` when the action updated the PR body with the PlanSync status block; `"false"` when the body was already in sync or PR-body sync was not configured.'
runs:
  using: 'node20'
  main: 'dist/index.js'
