name: cursor-review-stale

# Weekly conservative sweep over open `review-finding` issues:
#   - >= 14d + referenced file gone on default branch  → auto-close
#   - >= 30/60/90d                                     → label stale:Nd
#   - 90d also pings the repo owner
#
# No LLM is used; auto-close only fires when GitHub itself confirms the file
# is gone. Manual override: add the `do-not-close` label.

on:
  schedule:
    # Mondays 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log intended actions without mutating issues'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout (script only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/review-stale.mjs
          sparse-checkout-cone-mode: false

      - name: Run stale sweep
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REVIEW_STALE_OWNER: ${{ github.repository_owner }}
          REVIEW_STALE_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/review-stale.mjs
