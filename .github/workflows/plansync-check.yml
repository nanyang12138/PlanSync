name: PlanSync Drift Check

# This workflow uses plansync/drift-check-action@v1 which is itself a TODO
# (R-092 / R-093 / R-094 in docs/REMEDIATION_PLAN.md tracks fixing the
# action's missing dist/, secret masking, and PR-scope filtering). Until
# those land + a real PlanSync server is configured, we keep the workflow
# in place but soft-skip when its required secrets are absent so every
# PR doesn't show a spurious red X.

on:
  pull_request:

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check for required secrets
        id: secrets
        env:
          API_URL: ${{ secrets.PLANSYNC_API_URL }}
          API_KEY: ${{ secrets.PLANSYNC_API_KEY }}
          PROJECT: ${{ secrets.PLANSYNC_PROJECT_ID }}
        run: |
          if [ -z "${API_URL:-}" ] || [ -z "${API_KEY:-}" ] || [ -z "${PROJECT:-}" ]; then
            echo "::warning::PlanSync drift-check skipped — one or more of PLANSYNC_API_URL / PLANSYNC_API_KEY / PLANSYNC_PROJECT_ID secrets are not configured."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run drift-check action
        if: steps.secrets.outputs.skip != 'true'
        uses: plansync/drift-check-action@v1
        with:
          api-url: ${{ secrets.PLANSYNC_API_URL }}
          api-key: ${{ secrets.PLANSYNC_API_KEY }}
          project: ${{ secrets.PLANSYNC_PROJECT_ID }}
