name: cursor-review-triage

# Listens for cursor-review-action comments on PRs and triages them into
# structured GitHub issues (must/should-fix only). Fingerprint-based
# dedupe across PRs. Posts a single summary comment back on the PR.
#
# Never blocks merging. The LLM call routes through Cursor's Cloud Agent
# API (no-repo agent + SSE stream), so this workflow only needs the
# `CURSOR_API_KEY` secret that cursor-review.yml already uses — no
# separate Anthropic / AMD key required.
#
# Without CURSOR_API_KEY this workflow is a no-op.
#
# Loop safety: only triggers on comments whose body starts with the
# `<!-- cursor-review-action:review -->` marker. The summary comment we post
# back uses a different marker, so it cannot retrigger this workflow.
#
# Author check: cursor-review.yml posts the review comment using either
# GITHUB_TOKEN (author = github-actions[bot]) or CURSOR_REVIEW_PAT (author
# = the PAT owner). Note that comments created via GITHUB_TOKEN do NOT
# fire downstream workflow runs at all (GitHub anti-recursion rule), so
# triage only ever sees the PAT-authored variant in practice. We keep the
# author check loose (any repo OWNER / MEMBER / COLLABORATOR) and rely on
# the marker + author_association as the security boundary, so that the
# workflow keeps working if the PAT owner changes or a GitHub App token is
# substituted later.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage:
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '<!-- cursor-review-action:review -->') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    # 10min: Cloud Agent spinup + run can take 30-60s on average and the
    # script's own hard timeout for the agent stream is 5min; we need
    # workflow > script timeout so a slow run gets a clean timeout from
    # the script (which releases the reaction lock) rather than a SIGTERM
    # from GitHub mid-acquire.
    timeout-minutes: 10
    steps:
      - name: Check for Cursor API key
        id: key
        env:
          CURSOR_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "${CURSOR_KEY:-}" ]; then
            echo "CURSOR_API_KEY is not set; skipping triage."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.key.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout (script only)
        if: steps.key.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/review-triage.mjs
          sparse-checkout-cone-mode: false

      - name: Run triage
        if: steps.key.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          REVIEW_TRIAGE_MAX_ISSUES: '5'
        run: node scripts/review-triage.mjs
