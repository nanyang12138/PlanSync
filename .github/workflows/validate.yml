name: validate

# This workflow is the sole quality gate before auto-merge-cursor-pr.yml
# fires. Every job here is REQUIRED to be green; do not relax any check
# without considering the auto-merge impact.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096
  NEXT_TELEMETRY_DISABLED: '1'
  # Opt into Node 24 for actions/checkout@v4 + actions/setup-node@v4
  # (they still ship Node 20 today; GitHub forces Node 24 on
  # 2026-06-02 and removes Node 20 on 2026-09-16). Mirrors the
  # cursor-review.yml precedent already established in this repo.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ─────────────────────────── Static analysis ───────────────────────────

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: ESLint (max-warnings=0)
        run: npx eslint packages/*/src --max-warnings 0

  format-check:
    name: format-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Prettier check
        run: |
          npx prettier --check \
            'packages/*/src/**/*.{ts,tsx,json}' \
            'docs/**/*.md' \
            '*.{json,md,yml,yaml}' \
            '.github/**/*.yml'

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # shared must be built first; downstream tsconfigs reference its
      # emitted .d.ts via the workspace symlink in node_modules.
      - name: Build shared (provides .d.ts)
        run: npm run build --workspace=@plansync/shared

      # esbuild does NOT type-check; bundling alone can ship broken TS.
      # We run tsc --noEmit explicitly for every workspace that uses esbuild
      # or that has its own tsconfig.
      #
      # NOTE: mcp-server is intentionally NOT typechecked here. The combination
      # of MCP SDK 1.3.x + Zod 3.x + TypeScript 5.7 triggers TS2589 (deep
      # type-instantiation explosion) on `server.tool<Args extends ZodRawShape>`
      # overloads, blowing tsc heap past 8 GB. Tracked in REMEDIATION_PLAN.md
      # (R-131); once the SDK is upgraded the next bullet should be restored.
      - name: tsc --noEmit (cli)
        run: npx tsc --noEmit --project packages/cli/tsconfig.json

      - name: tsc --noEmit (api)
        run: npx tsc --noEmit --project packages/api/tsconfig.json

  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Validate PR commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck on scripts/ and bin/
        run: |
          set -euo pipefail
          # Collect files: anything with a sh/bash shebang or .sh extension.
          mapfile -t FILES < <(
            find scripts bin -type f \( -name '*.sh' -o -perm -u+x \) 2>/dev/null \
              | while read -r f; do
                  head -1 "$f" | grep -qE '^#!.*\b(ba)?sh\b' && echo "$f" || true
                done
          )
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No shell scripts found; skipping."
            exit 0
          fi
          echo "Checking ${#FILES[@]} script(s):"
          printf '  %s\n' "${FILES[@]}"
          # SC2086 (unquoted vars) and SC1091 (source not followed) downgraded
          # to warning for now; can tighten later.
          shellcheck --severity=error --shell=bash "${FILES[@]}"

  # ─────────────────────────── Database integrity ───────────────────────────

  prisma-validate:
    name: prisma-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # prisma CLI evaluates env() references during `validate` / `format`
      # even though no DB connection is opened. A dummy URL is enough.
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: prisma validate
        run: npx prisma validate --schema=packages/api/prisma/schema.prisma

      - name: prisma format check (idempotency)
        run: |
          cp packages/api/prisma/schema.prisma /tmp/schema.before
          npx prisma format --schema=packages/api/prisma/schema.prisma
          if ! diff -u /tmp/schema.before packages/api/prisma/schema.prisma; then
            echo "::error::schema.prisma is not formatted; run 'npx prisma format'."
            exit 1
          fi

      - name: Forbid modifying existing migration files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_SHA" --depth=1 2>/dev/null || true
          MODIFIED=$(git diff --name-only --diff-filter=M "$BASE_SHA"..."$HEAD_SHA" -- \
            'packages/api/prisma/migrations/*/migration.sql' || true)
          if [ -n "$MODIFIED" ]; then
            echo "::error::Existing migration files must not be modified after creation."
            echo "Modified files:"
            echo "$MODIFIED" | sed 's/^/  /'
            echo ""
            echo "Create a new migration instead:"
            echo "  npx prisma migrate dev --name <description>"
            exit 1
          fi

  # ─────────────────────────── Build & artifact integrity ───────────────────────────

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build @plansync/shared
        run: npm run build --workspace=@plansync/shared

      - name: Verify shared build output
        run: |
          set -e
          test -f packages/shared/dist/index.js  || { echo "::error::missing shared/dist/index.js"; exit 1; }
          test -f packages/shared/dist/index.d.ts || { echo "::error::missing shared/dist/index.d.ts"; exit 1; }

      - name: Build @plansync/mcp-server
        run: npm run build --workspace=@plansync/mcp-server

      - name: Verify mcp-server build output
        run: |
          set -e
          test -f packages/mcp-server/dist/index.js || { echo "::error::missing mcp-server/dist/index.js"; exit 1; }
          # NOTE: do NOT attempt to `node -e "require(...)"` this bundle —
          # mcp-server's top-level code starts a stdio MCP server that
          # listens on stdin forever, so the require() never returns and
          # the CI step hangs until job timeout. Existence + a successful
          # esbuild bundle is sufficient verification at this stage.

      - name: Build @plansync/cli
        run: npm run build --workspace=@plansync/cli

      - name: Verify cli build output
        run: |
          set -e
          test -f packages/cli/dist/index.js  || { echo "::error::missing cli/dist/index.js"; exit 1; }
          # G2 (ink 4 → 6): ink 6 ships JS-native yoga-layout, no wasm needed.
          # The legacy yoga.wasm copy step was removed from packages/cli/build.

      - name: Build @plansync/api
        run: npm run build --workspace=@plansync/api

      - name: Verify api build output
        run: |
          set -e
          # next.config.js writes to tmp/ps-next-build-<USER>
          if ! ls packages/api/tmp/ps-next-build-* >/dev/null 2>&1; then
            # In case the directory naming uses CI user, also accept standard .next
            if ! test -d packages/api/.next; then
              echo "::error::no Next.js build output found"
              exit 1
            fi
          fi

      # The GitHub Action under packages/integrations/github-action/ runs
      # `dist/index.js` directly via `action.yml` — there is no install step
      # on the consumer's runner, so the committed bundle IS the deployable
      # artifact. If it drifts from `index.ts`, or worse, is missing entirely,
      # consumers ship stale / broken code (root cause of issue #1265).
      #
      # Why `git status --porcelain` and NOT `git diff --exit-code` (closes
      # finding #1269):
      #   `git diff` only compares **tracked** files. If a PR forgets to
      #   `git add` the freshly rebuilt `dist/index.js`, the file lives on
      #   disk as untracked and `git diff` sees nothing — the staleness
      #   check would silently pass. `git status --porcelain` surfaces
      #   modified-tracked, untracked, AND deleted files in one shot, so
      #   none of those failure modes slip through.
      #
      # Why the dual gate (base-tracked check + porcelain check):
      #   We must also defend against a PR that **deletes** the tracked
      #   bundle to bypass the check. We probe whether `dist/index.js` is
      #   tracked in the merge base; if it was, the PR is required to keep
      #   it tracked. Without this, "untracked = skip" would re-open the
      #   exact hole #1269 reports, just via the delete path.
      #
      # Pre-#1268 transitional state:
      #   On a base branch where the bundle has never been committed,
      #   `BASE_HAS_DIST=false` and we emit a notice + skip. This avoids
      #   reddening master before the dist is first committed. Once #1268
      #   lands and `dist/index.js` is in the base tree, the gate becomes
      #   mandatory automatically — no follow-up edit to this workflow.
      - name: Rebuild GitHub Action bundle
        run: npm run build:action --workspace=@plansync/integrations

      - name: Verify GitHub Action bundle is committed and up-to-date
        env:
          # On pull_request events GitHub sets these to the PR base/head; on
          # push-to-master they are empty, and we fall back to HEAD~1.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          REL='packages/integrations/github-action/dist/index.js'
          DIST_DIR='packages/integrations/github-action/dist'

          # 1) Determine the base-branch tracking state. If the bundle was
          #    tracked at the base of this change, the PR/push must keep it
          #    tracked — otherwise an adversarial delete would silently pass.
          #
          # IMPORTANT (closes finding #1283): the `build` job's
          # `actions/checkout@v4` uses the default shallow clone
          # (`fetch-depth: 1`), so `$BASE_SHA` is NOT in the local object
          # store. Without an explicit fetch, `git cat-file -e $BASE_SHA:$REL`
          # silently fails and we'd treat the base as "bundle not tracked",
          # bypassing the delete-protection gate added by #1277. We therefore
          # fetch the base commit on demand and, for the PR path, fail loud
          # if the fetch does not succeed — silently degrading to
          # `BASE_HAS_DIST=false` would re-open the exact attack surface this
          # gate exists to close.
          if [ -n "${BASE_SHA:-}" ]; then
            REF="$BASE_SHA"
            if ! git cat-file -e "$REF" 2>/dev/null; then
              if ! git fetch --no-tags --depth=1 origin "$REF" 2>/dev/null; then
                echo "::error::Could not fetch PR base commit $REF into the local object store; refusing to skip the bundle base-tracking probe. Re-run the job, or configure the build job's checkout with 'fetch-depth: 0' if this persists."
                exit 1
              fi
            fi
          else
            # push-to-master fallback. Shallow clones don't include HEAD~1
            # either; deepen by one commit. If that still fails (e.g. initial
            # commit, no parent exists), skip with a notice — push events are
            # post-merge and already gated by the PR path above.
            REF="HEAD~1"
            if ! git cat-file -e "$REF" 2>/dev/null; then
              git fetch --no-tags --deepen=1 2>/dev/null || true
            fi
          fi
          if [ -n "$REF" ] && git cat-file -e "$REF":"$REL" 2>/dev/null; then
            BASE_HAS_DIST=true
          else
            BASE_HAS_DIST=false
          fi

          # 2) Determine the head-branch tracking state.
          if git ls-files --error-unmatch "$REL" >/dev/null 2>&1; then
            HEAD_HAS_DIST=true
          else
            HEAD_HAS_DIST=false
          fi

          # 3) Hard-fail: PR removed a previously-tracked bundle.
          if [ "$BASE_HAS_DIST" = "true" ] && [ "$HEAD_HAS_DIST" = "false" ]; then
            echo "::error::$REL was tracked at the base ref ($REF) but is no longer tracked in this change. The bundle is the deployable artifact for the GitHub Action and must remain committed — run 'npm run build:action --workspace=@plansync/integrations' and 'git add $DIST_DIR/' before pushing."
            exit 1
          fi

          # 4) Transitional skip: bundle has never been committed yet (pre-#1268).
          if [ "$BASE_HAS_DIST" = "false" ] && [ "$HEAD_HAS_DIST" = "false" ]; then
            echo "::notice::$REL is not tracked at base ($REF) and not tracked in HEAD — skipping bundle staleness check (transitional state; will become mandatory once the bundle is first committed)."
            exit 0
          fi

          # 5) Staleness gate. `git status --porcelain` catches:
          #      - tracked file modified (rebuild produced different bytes)
          #      - tracked file deleted   (working tree missing files)
          #      - new files appeared     (esbuild emitted extra outputs)
          #    `git diff` would miss the third category, which is the
          #    finding called out in #1269.
          STATUS=$(git status --porcelain -- "$DIST_DIR")
          if [ -n "$STATUS" ]; then
            echo "::error::Committed GitHub Action bundle is stale or incomplete. Run 'bash scripts/build.sh' (or 'npm run build:action --workspace=@plansync/integrations') and commit the regenerated '$DIST_DIR/' files."
            echo 'Affected paths:'
            echo "$STATUS" | sed 's/^/  /'
            exit 1
          fi

  # ─────────────────────────── Test ───────────────────────────

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: plansync
          POSTGRES_PASSWORD: plansync
          POSTGRES_DB: plansync_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U plansync"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://plansync:plansync@localhost:15432/plansync_test
      PLANSYNC_SECRET: test-secret-please-change-in-prod-32chars-min
      AUTH_DISABLED: 'true'
      LOG_LEVEL: error
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 15432 -U plansync >/dev/null 2>&1; then
              echo "Postgres ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Postgres did not become ready in 30s"
          exit 1

      - name: Build shared (test deps need .d.ts)
        run: npm run build --workspace=@plansync/shared

      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/api/prisma/schema.prisma

      - name: Apply migrations
        run: npx prisma migrate deploy --schema=packages/api/prisma/schema.prisma

      - name: Run vitest suites (excludes e2e)
        run: npm run test --workspaces --if-present

  # ─────────────────────────── Security ───────────────────────────

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # GITLEAKS_LICENSE: not needed for public/personal repos
          # See https://github.com/gitleaks/gitleaks-action

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (with audit metadata)
        run: npm ci --no-fund

      - name: npm audit (production deps, critical only)
        run: |
          # Production dependencies only.
          #
          # NOTE: audit-level is `critical` here, not `high`, because
          # Next.js 14.2.x has 2 known HIGH CVEs that only the 16.x
          # upgrade fixes (tracked in REMEDIATION_PLAN.md R-131). If we
          # gate on `high`, every PR is blocked until the Next 16 PR
          # lands — including the cron-driven remediation PRs.
          #
          # Nightly workflow (nightly.yml) still runs `npm audit --json`
          # at all severities and opens issues on HIGH+ findings, so
          # nothing slips through unnoticed.
          set +e
          npm audit --omit=dev --audit-level=critical
          EXIT=$?
          set -e
          if [ "$EXIT" -ne 0 ]; then
            echo "::error::npm audit found CRITICAL vulnerabilities in production deps."
            exit 1
          fi
